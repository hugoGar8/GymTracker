<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gym Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#1D9E75">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f4;
    --bg-tertiary: #eeece8;
    --text: #1a1a18;
    --text-secondary: #6b6b66;
    --text-tertiary: #9e9e98;
    --border: rgba(0,0,0,0.1);
    --border-md: rgba(0,0,0,0.18);
    --accent: #1D9E75;
    --accent-light: #e1f5ee;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-xl: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #242422;
      --bg-tertiary: #2c2c29;
      --text: #f0ede8;
      --text-secondary: #9e9e98;
      --text-tertiary: #6b6b66;
      --border: rgba(255,255,255,0.1);
      --border-md: rgba(255,255,255,0.18);
      --accent: #1D9E75;
      --accent-light: #04342c;
    }
  }

  html, body {
    background: var(--bg-tertiary);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg-tertiary);
    position: relative;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-tertiary);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 20px 12px;
    border-bottom: 0.5px solid var(--border);
  }

  .top-bar-inner {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .back-btn {
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .back-btn:hover { background: var(--bg-tertiary); }
  .back-btn:active { transform: scale(0.95); }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    min-width: 0;
  }
  .breadcrumb .crumb { cursor: pointer; white-space: nowrap; }
  .breadcrumb .crumb:hover { color: var(--text); }
  .breadcrumb .sep { font-size: 12px; opacity: 0.5; flex-shrink: 0; }
  .breadcrumb .active {
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .page-content {
    padding: 20px 16px 40px;
  }

  /* ── Home hero ── */
  .hero {
    padding: 28px 20px 20px;
    text-align: center;
  }
  .hero-icon {
    font-size: 40px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .hero h1 {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .hero p {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* ── Section label ── */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
    padding: 0 4px;
  }

  /* ── Day grid ── */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .day-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 16px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .day-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .day-card.d1::before { background: #1D9E75; }
  .day-card.d2::before { background: #378ADD; }
  .day-card.d3::before { background: #D85A30; }
  .day-card.d4::before { background: #7F77DD; }
  .day-card:hover { transform: translateY(-2px); border-color: var(--border-md); }
  .day-card:active { transform: scale(0.98); }

  .day-num {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .day-card.d1 .day-num { color: #1D9E75; }
  .day-card.d2 .day-num { color: #378ADD; }
  .day-card.d3 .day-num { color: #D85A30; }
  .day-card.d4 .day-num { color: #7F77DD; }

  .day-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .day-meta {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ── Block list ── */
  .block-list { display: flex; flex-direction: column; gap: 8px; }

  .block-item {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .block-item:hover { border-color: var(--border-md); background: var(--bg-secondary); }
  .block-item:active { transform: scale(0.99); }

  .block-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .block-info { flex: 1; min-width: 0; }
  .block-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .block-count { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .block-chevron { font-size: 18px; color: var(--text-tertiary); flex-shrink: 0; }

  /* ── Exercise cards ── */
  .exercise-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .exercise-header {
    padding: 16px 16px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .exercise-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    line-height: 1.3;
  }
  .exercise-schema {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .schema-badge {
    display: inline-block;
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Week tabs */
  .week-tabs-wrapper {
    padding: 0 16px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .week-tabs-wrapper::-webkit-scrollbar { display: none; }

  .week-tab {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    background: none;
    color: var(--text-secondary);
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .week-tab:hover { border-color: var(--border-md); color: var(--text); }
  .week-tab.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
    font-weight: 500;
  }
  .week-tab.has-data {
    border-color: var(--accent);
    color: var(--accent);
  }
  .add-week-btn {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px dashed var(--border-md);
    font-size: 13px;
    cursor: pointer;
    background: none;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    transition: all 0.15s;
  }
  .add-week-btn:hover { color: var(--text); border-color: var(--text-tertiary); }

  /* Week content */
  .week-content {
    padding: 14px 16px 16px;
    border-top: 0.5px solid var(--border);
  }

  .sets-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }

  .sets-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .set-num {
    font-size: 13px;
    color: var(--text-secondary);
    width: 52px;
    flex-shrink: 0;
  }

  .set-input {
    flex: 1;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 500;
    background: var(--bg-secondary);
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
    min-width: 0;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .set-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg);
    box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
  }
  .set-input::placeholder { color: var(--text-tertiary); font-weight: 400; }

  .set-unit {
    font-size: 13px;
    color: var(--text-secondary);
    width: 24px;
    flex-shrink: 0;
  }

  .notes-input {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 14px;
    background: var(--bg-secondary);
    color: var(--text);
    font-family: inherit;
    resize: none;
    margin-top: 4px;
    transition: border-color 0.15s, background 0.15s;
    line-height: 1.5;
  }
  .notes-input:focus {
    outline: none;
    border-color: var(--border-md);
    background: var(--bg);
  }
  .notes-input::placeholder { color: var(--text-tertiary); }

  .save-indicator {
    font-size: 12px;
    color: var(--accent);
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .save-indicator.show { opacity: 1; }

  /* ── Save button ── */
  .save-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s, transform 0.12s, background 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
    margin-left: auto;
  }
  .save-btn:active { transform: scale(0.95); }
  .save-btn.saved {
    background: #4caf82;
  }
  .save-btn i { font-size: 15px; }

  /* View transitions */
  .view { display: none; }
  .view.active { display: block; }

  /* ── Bottom safe area ── */
  .bottom-pad { height: env(safe-area-inset-bottom, 16px); }

  /* ── Tap highlight ── */
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Top bar -->
  <div class="top-bar" id="topBar" style="display:none">
    <div class="top-bar-inner">
      <button class="back-btn" id="backBtn" onclick="goBack()" aria-label="Volver">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </button>
      <div class="breadcrumb" id="breadcrumb"></div>
      <button class="save-btn" id="saveBtn" onclick="manualSave()" aria-label="Guardar" style="display:none">
        <i class="ti ti-device-floppy"></i> Guardar
      </button>
    </div>
  </div>

  <!-- ── VIEW: Días ── -->
  <div class="view active" id="view-dias">
    <div class="hero">
      <div class="hero-icon"><i class="ti ti-barbell" aria-hidden="true"></i></div>
      <h1>Gym Tracker</h1>
      <p>Registra tus pesos semana a semana</p>
    </div>
    <div class="page-content" style="padding-top:0">
      <p class="section-label">Selecciona el día</p>
      <div class="day-grid" id="dayGrid"></div>
    </div>
  </div>

  <!-- ── VIEW: Bloques ── -->
  <div class="view" id="view-bloques">
    <div class="page-content">
      <p class="section-label">Selecciona el bloque</p>
      <div class="block-list" id="blockList"></div>
    </div>
  </div>

  <!-- ── VIEW: Ejercicios ── -->
  <div class="view" id="view-ejercicios">
    <div class="page-content" id="ejerciciosContent"></div>
  </div>

  <div class="bottom-pad"></div>
</div>

// ── State ──
let state = { view: 'dias', diaId: null, bloqueId: null };
let data = {};
try { const s = localStorage.getItem('gym_tracker_v3'); if(s) data = JSON.parse(s); } catch(e){}

function save() { try { localStorage.setItem('gym_tracker_v3', JSON.stringify(data)); } catch(e){} }

// ── Storage helpers ──
function key(dId,bId,eId,sem,set){ return `${dId}_${bId}_${eId}_s${sem}_r${set}`; }
function noteKey(dId,bId,eId,sem){ return `${dId}_${bId}_${eId}_s${sem}_notes`; }
function weeksKey(dId,bId,eId){ return `${dId}_${bId}_${eId}_weeks`; }
function awKey(dId,bId,eId){ return `${dId}_${bId}_${eId}_aw`; }
function getWeeks(dId,bId,eId){ return data[weeksKey(dId,bId,eId)] || [1]; }
function getAW(dId,bId,eId){ return data[awKey(dId,bId,eId)] || 1; }
function hasData(dId,bId,ej,sem){
  for(let s=1;s<=ej.sets;s++) if(data[key(dId,bId,ej.id,sem,s)]) return true;
  return false;
}

// ── Navigation ──
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  const tb = document.getElementById('topBar');
  const sb = document.getElementById('saveBtn');
  tb.style.display = (name==='dias') ? 'none' : 'block';
  sb.style.display = (name==='ejercicios') ? 'flex' : 'none';
  window.scrollTo(0,0);
}

function updateBreadcrumb(){
  const dia = ROUTINE.dias.find(d=>d.id===state.diaId);
  const bloque = dia?.bloques.find(b=>b.id===state.bloqueId);
  const bc = document.getElementById('breadcrumb');
  let html = `<span class="crumb" onclick="goToDias()">Inicio</span>`;
  if(dia){
    html += `<span class="sep"><i class="ti ti-chevron-right"></i></span>`;
    if(bloque){
      html += `<span class="crumb" onclick="goToBloques()">${'Día '+(ROUTINE.dias.indexOf(dia)+1)}</span>`;
      html += `<span class="sep"><i class="ti ti-chevron-right"></i></span>`;
      html += `<span class="active">${bloque.nombre}</span>`;
    } else {
      html += `<span class="active">Día ${ROUTINE.dias.indexOf(dia)+1} — ${dia.label}</span>`;
    }
  }
  bc.innerHTML = html;
}

function goBack(){
  if(state.view==='ejercicios'){ goToBloques(); }
  else if(state.view==='bloques'){ goToDias(); }
}
function goToDias(){ state.view='dias'; state.diaId=null; state.bloqueId=null; showView('dias'); }
function goToBloques(){ state.view='bloques'; state.bloqueId=null; renderBloques(); showView('bloques'); updateBreadcrumb(); }

// ── Render días ──
function renderDias(){
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = ROUTINE.dias.map((d,i)=>`
    <div class="day-card ${d.color}" onclick="selectDia('${d.id}')" role="button" tabindex="0">
      <div class="day-num">Día ${i+1}</div>
      <div class="day-label">${d.label}</div>
      <div class="day-meta">${d.bloques.length} bloques · ${d.bloques.reduce((a,b)=>a+b.ejercicios.length,0)} ejercicios</div>
    </div>
  `).join('');
}

function selectDia(id){
  state.diaId = id;
  state.view = 'bloques';
  renderBloques();
  showView('bloques');
  updateBreadcrumb();
}

// ── Render bloques ──
function renderBloques(){
  const dia = ROUTINE.dias.find(d=>d.id===state.diaId);
  const list = document.getElementById('blockList');
  const icons = ['ti-bolt','ti-flame','ti-bounce-right','ti-arrows-up-down','ti-trophy'];
  list.innerHTML = dia.bloques.map((b,i)=>`
    <div class="block-item" onclick="selectBloque('${b.id}')" role="button" tabindex="0">
      <div class="block-icon"><i class="ti ${icons[i]||'ti-dumbbell'}" aria-hidden="true"></i></div>
      <div class="block-info">
        <div class="block-name">${b.nombre}</div>
        <div class="block-count">${b.ejercicios.length} ejercicios</div>
      </div>
      <i class="ti ti-chevron-right block-chevron" aria-hidden="true"></i>
    </div>
  `).join('');
}

function selectBloque(id){
  state.bloqueId = id;
  state.view = 'ejercicios';
  renderEjercicios();
  showView('ejercicios');
  updateBreadcrumb();
}

// ── Render ejercicios ──
function renderEjercicios(){
  const dia = ROUTINE.dias.find(d=>d.id===state.diaId);
  const bloque = dia.bloques.find(b=>b.id===state.bloqueId);
  const container = document.getElementById('ejerciciosContent');

  let html = '';
  bloque.ejercicios.forEach(ej => {
    const weeks = getWeeks(dia.id, bloque.id, ej.id);
    const aw = getAW(dia.id, bloque.id, ej.id);

    const tabsHtml = weeks.map(w=>{
      const isActive = w===aw;
      const hw = hasData(dia.id, bloque.id, ej, w);
      return `<button class="week-tab ${isActive?'active':hw?'has-data':''}"
        onclick="setWeek('${dia.id}','${bloque.id}','${ej.id}',${w})">
        Sem ${w}${hw&&!isActive?' ●':''}
      </button>`;
    }).join('');

    let setsHtml = '';
    for(let s=1;s<=ej.sets;s++){
      const v = data[key(dia.id,bloque.id,ej.id,aw,s)] || '';
      setsHtml += `
        <div class="sets-row">
          <span class="set-num">Serie ${s}</span>
          <input class="set-input" type="number" inputmode="decimal" min="0" step="0.5"
            placeholder="—" value="${v}"
            onchange="saveSet('${dia.id}','${bloque.id}','${ej.id}',${aw},${s},this.value,'ind_${ej.id}')"
            aria-label="Peso serie ${s}">
          <span class="set-unit">kg</span>
        </div>`;
    }

    const nv = data[noteKey(dia.id,bloque.id,ej.id,aw)] || '';
    const nextSem = weeks[weeks.length-1]+1;

    html += `
      <div class="exercise-card">
        <div class="exercise-header">
          <div>
            <div class="exercise-name">${ej.nombre}</div>
            <div class="exercise-schema">${ej.schema}</div>
          </div>
          <span class="schema-badge">${ej.schema}</span>
        </div>
        <div class="week-tabs-wrapper">
          ${tabsHtml}
          <button class="add-week-btn" onclick="addWeek('${dia.id}','${bloque.id}','${ej.id}')">
            <i class="ti ti-plus" style="font-size:12px" aria-hidden="true"></i> Sem ${nextSem}
          </button>
        </div>
        <div class="week-content">
          <div class="sets-label">Semana ${aw}</div>
          ${setsHtml}
          <textarea class="notes-input" rows="2" placeholder="Notas (sensaciones, ajustes...)"
            onchange="saveNotes('${dia.id}','${bloque.id}','${ej.id}',${aw},this.value,'ind_${ej.id}')"
            aria-label="Notas">${nv}</textarea>
          <div class="save-indicator" id="ind_${ej.id}">
            <i class="ti ti-check" style="font-size:14px" aria-hidden="true"></i> Guardado
          </div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

// ── Data operations ──
function saveSet(dId,bId,eId,sem,set,val,indId){
  const k = key(dId,bId,eId,sem,set);
  if(val!=='') data[k]=parseFloat(val); else delete data[k];
  save(); flash(indId);
}
function saveNotes(dId,bId,eId,sem,val,indId){
  const k = noteKey(dId,bId,eId,sem);
  if(val.trim()) data[k]=val; else delete data[k];
  save(); flash(indId);
}
function manualSave(){
  // Recorrer todos los inputs y textareas visibles y guardar sus valores actuales
  const container = document.getElementById('ejerciciosContent');
  if(!container) return;
  // Inputs de peso
  container.querySelectorAll('.set-input').forEach(input => {
    const onch = input.getAttribute('onchange');
    if(onch && input.value !== '') {
      // Ejecutar el onchange manualmente para asegurar que el valor está guardado
      const fn = new Function('event', onch);
      fn.call(input, {});
    }
  });
  // Notas
  container.querySelectorAll('.notes-input').forEach(ta => {
    const onch = ta.getAttribute('onchange');
    if(onch) {
      const fn = new Function('event', onch);
      fn.call(ta, {});
    }
  });
  save();
  // Feedback visual en el botón
  const btn = document.getElementById('saveBtn');
  btn.classList.add('saved');
  btn.innerHTML = '<i class="ti ti-check"></i> Guardado';
  setTimeout(()=>{
    btn.classList.remove('saved');
    btn.innerHTML = '<i class="ti ti-device-floppy"></i> Guardar';
  }, 2000);
}
function flash(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1600);
}
function setWeek(dId,bId,eId,sem){
  data[awKey(dId,bId,eId)]=sem;
  save(); renderEjercicios();
}
function addWeek(dId,bId,eId){
  const weeks=getWeeks(dId,bId,eId);
  const nw=weeks[weeks.length-1]+1;
  weeks.push(nw);
  data[weeksKey(dId,bId,eId)]=weeks;
  data[awKey(dId,bId,eId)]=nw;
  save(); renderEjercicios();
}

// Keyboard support for cards
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'||e.key===' '){
    const t=document.activeElement;
    if(t&&t.getAttribute('role')==='button'){ e.preventDefault(); t.click(); }
  }
});

// ── Init ──
renderDias();

// ── Service Worker (PWA) ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
